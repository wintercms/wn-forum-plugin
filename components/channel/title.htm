<div class="row p-b">

    <div class="col-md-9">
        {{ form_open({ method: 'get' })}}
            <div class="search-box">
                <input type="text" name="search" class="form-control" placeholder="{{ 'winter.forum::lang.components.channel.search_placeholder' | trans }}" value="{{ input('search')|e }}">
            </div>
        {{ form_close() }}
    </div>
    <div class="text-right col-md-3">
        {% if isGuest %}
            <p>{{ 'winter.forum::lang.components.channel.log_to_post' | trans }}</p>
        {% else %}
            <a href="{{ topicPage|page }}?channel={{ channel.id }}" class="btn btn-primary btn-block">
                {{ 'winter.forum::lang.components.channel.post_new_topic' | trans }}
            </a>
        {% endif %}
    </div>

</div>
