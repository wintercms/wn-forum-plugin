{{ form_open({ request: 'onCreate' }) }}

    <div class="form-group">
        <label for="topicSubject" class="control-label">{{ 'winter.forum::lang.components.topic.subject' | trans }}</label>
        <input id="topicSubject" name="subject" type="text" class="form-control" value="{{ post('subject') }}" />
    </div>

    <div class="form-group">
        <label for="topicContent" class="control-label">{{ 'winter.forum::lang.components.topic.content' | trans }}</label>
        <textarea id="topicContent" name="content" rows="8" type="text" class="form-control">
            {{- post('content') -}}
        </textarea>
        <span class="help-block">
        {{ 'winter.forum::lang.components.general.can_use_syntax' | trans({ syntax: '<a href="http://daringfireball.net/projects/markdown/syntax" target="_blank">Markdown</a>' }) | raw }}
        </span>
    </div>

    <div class="form-group post-buttons">
        <button type="submit" class="btn btn-primary">{{ 'winter.forum::lang.components.topic.save_topic' | trans }}</button>
        {% if returnUrl %}
            <a class="btn btn-link" href="{{ returnUrl }}">{{ 'winter.forum::lang.components.general.cancel' | trans }}</a>
        {% endif %}
    </div>

    <input type="hidden" name="channel" value="{{ channel.id }}" />

{{ form_close() }}
