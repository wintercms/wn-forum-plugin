# ===================================
#  Form Field Definitions
# ===================================

fields:
    parent:
        label: winter.forum::lang.models.channel.parent
        type: relation
        nameFrom: title
        emptyOption: winter.forum::lang.models.channel.noparent

    title:
        label: winter.forum::lang.models.channel.title
        span: left

    slug:
        label: winter.forum::lang.models.channel.slug
        span: right
        preset: title

    description:
        label: winter.forum::lang.models.channel.desc
        type: textarea
        size: tiny

    is_moderated:
        label: winter.forum::lang.models.channel.moderated
        comment: winter.forum::lang.models.channel.is_mod
        type: checkbox
        span: auto

    is_hidden:
        label: winter.forum::lang.models.channel.hidden
        comment: winter.forum::lang.models.channel.is_hidden
        type: checkbox
        span: auto

    is_guarded:
        label: winter.forum::lang.models.channel.guarded
        comment: winter.forum::lang.models.channel.is_guarded
        type: checkbox
        span: full
